  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rder-bottom:1px solid var(--line)\">\n    <div data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:20px\">\n      <button sc-camel-on-click=\"{{ go.home }}\" style=\"display:flex;align-items:center;gap:11px;background:none;border:none;cursor:pointer;padding:0\">\n        <img src=\"b69d791a-edf5-46c8-93d2-6c17ad636cc9\" alt=\"Sea Cloud Consulting\" width=\"36\" height=\"36\" style=\"border-radius:50%;display:block\">\n        <span style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:17px;letter-spacing:-0.01em;color:var(--ink)\">Sea Cloud Consulting<\u002Fspan>\n      <\u002Fbutton>\n      <nav data-nav-links=\"\" style=\"margin-left:auto;display:flex;align-items:center;gap:28px\">\n        <button sc-camel-on-click=\"{{ go.home }}\" style=\"background:none;border:none;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink-2);padding:4px 0\" style-hover=\"color:var(--ink)\">Home<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.services }}\" style=\"background:none;border:none;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink-2);padding:4px 0\" style-hover=\"color:var(--ink)\">Services<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.about }}\" style=\"background:none;border:none;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink-2);padding:4px 0\" style-hover=\"color:var(--ink)\">About<\u002Fbutton>\n      <\u002Fnav>\n      <button sc-camel-on-click=\"{{ go.contact }}\" style=\"margin-left:12px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--ink)\">Get in Touch<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main>\n\n  <!-- ============ HOME ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:32px 40px 28px\">\n      <div data-hero-card=\"\" style=\"background:var(--ink);border-radius:24px;padding:44px 40px 36px\">\n      <div data-hero=\"\" style=\"display:grid;align-items:stretch;grid-template-columns:minmax(0,1fr) 260px;gap:48px\">\n        <div style=\"animation:fadeUp .6s ease both;align-self:center\">\n          <h1 data-h1=\"\" style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(36px,4.5vw - 3px,62px);line-height:1.05;letter-spacing:-0.025em;margin:0 0 18px;color:#fff\">Senior FP&amp;A Operator, Embedded Part-Time<\u002Fh1>\n          <p style=\"font-size:21px;line-height:1.4;color:color-mix(in srgb,#fff 78%,transparent);margin:0 0 30px;text-wrap:pretty;font-family:'Bricolage Grotesque';font-weight:400;letter-spacing:-0.015em\">For the gaps, transitions, and projects that can't wait.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:36px\">\n            <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:15px 30px;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--accent-2)\">Get in Touch<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ go.services }}\" style=\"background:none;border:none;color:var(--accent-2);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;padding:0\" style-hover=\"color:#fff\">Learn more about my offering →<\u002Fbutton>\n          <\u002Fdiv>\n          <div data-grid3=\"\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"border-left:1px solid color-mix(in srgb,#fff 22%,transparent);padding:2px 0 2px 18px\">\n                <div style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:19px;letter-spacing:-0.01em;margin-bottom:6px;white-space:pre-line;color:#fff\">{{ s.k }}<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.4;color:color-mix(in srgb,#fff 60%,transparent)\">{{ s.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-hero-art=\"\" sc-camel-on-mouse-enter=\"{{ hoverOn }}\" sc-camel-on-mouse-leave=\"{{ hoverOff }}\" style=\"position:relative;min-height:380px;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,#fff 15%,transparent);cursor:pointer\">\n          <img src=\"5c417c75-5765-4418-a610-ac077b610780\" alt=\"Ocean, beach and buildings\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.55) contrast(1.02)\">\n          <div style=\"position:absolute;inset:0;background:var(--accent);mix-blend-mode:color;opacity:{{ tintOpacity }};transition:opacity .4s ease\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, color-mix(in srgb, var(--ink) 12%, transparent) 40%, color-mix(in srgb, var(--ink) 70%, transparent));opacity:{{ tintOpacity }};transition:opacity .4s ease\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- pain points -->\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:36px 40px 20px\">\n      <div data-grid3=\"\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n        <sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n            <div style=\"width:46px;height:46px;border-radius:12px;background:var(--accent-wash);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px\">{{ p.e }}<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.55;color:var(--ink-2);text-wrap:pretty\">{{ p.t }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:26px;letter-spacing:-0.02em;margin:40px 0 0;text-align:center;color:var(--ink-2)\">If any of these sound familiar, <span style=\"color:var(--ink)\">here's how I can help.<\u002Fspan><\u002Fp>\n    <\u002Fsection>\n\n    <!-- services overview -->\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:24px 40px 48px\">\n      <div data-split=\"\" style=\"display:grid;grid-template-columns:0.9fr 1.1fr;gap:52px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:44px\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono';font-size:12.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">Services<\u002Fdiv>\n          <h2 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px\">Senior FP&amp;A support for technology and healthcare companies<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 26px\">I step into complex situations and leave them working better.<\u002Fp>\n          <div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:center\">\n            <button sc-camel-on-click=\"{{ go.services }}\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--ink)\">See all services<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:0\" style-hover=\"color:var(--ink)\">Get in touch<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)\">\n              <span style=\"font-family:'IBM Plex Mono';font-size:13px;color:var(--accent)\">{{ s.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em\">{{ s.title }}<\u002Fdiv>\n                <sc-if value=\"{{ s.meta }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--muted);margin-top:3px\">{{ s.meta }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- about teaser -->\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:48px 40px\">\n      <div data-split=\"\" style=\"display:grid;grid-template-columns:1.1fr 0.9fr;gap:52px;align-items:center\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono';font-size:12.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">About<\u002Fdiv>\n          <h2 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 18px\">The person you talk to is the person doing the work<\u002Fh2>\n          <p style=\"font-size:16.5px;line-height:1.62;color:var(--ink-2);margin:0 0 16px\">I bring over 20 years in finance, the last 15 leading FP&amp;A at healthcare and high-growth technology companies.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.62;color:var(--ink-2);margin:0 0 24px\">I founded Sea Cloud Consulting to give companies senior FP&amp;A help without the full-time hire. Some bring me in for a defined project. Most keep me embedded for the long haul.<\u002Fp>\n          <button sc-camel-on-click=\"{{ go.about }}\" style=\"background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:0\" style-hover=\"color:var(--ink)\">More about me →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:280px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(140deg, var(--surface), var(--accent-wash))\">\n          <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(180deg, transparent 0 22px, color-mix(in srgb, var(--accent) 14%, transparent) 22px 23px)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:24px;bottom:20px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2);opacity:.7\">— Mike, founder<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- engagements teaser -->\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:48px 40px 20px\">\n      <div style=\"text-align:center;margin-bottom:22px\">\n        <h2 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:26px;letter-spacing:-0.02em;margin:0\">Recent engagements<\u002Fh2>\n      <\u002Fdiv>\n      <div data-carousel-wrap=\"\" style=\"max-width:64%;margin:0 auto\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px\">\n        <button data-carousel-btn=\"\" aria-label=\"Previous engagement\" sc-camel-on-click=\"{{ prevEngagement }}\" style=\"width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-size:18px;cursor:pointer;color:var(--ink-2)\" style-hover=\"background:var(--accent-wash);color:var(--ink)\">←<\u002Fbutton>\n        <div style=\"overflow:hidden\">\n          <div sc-camel-on-touch-start=\"{{ onEngagementTouchStart }}\" sc-camel-on-touch-end=\"{{ onEngagementTouchEnd }}\" style=\"display:flex;transition:transform .45s ease;transform:translateX({{ engagementOffset }}%)\">\n            <sc-for list=\"{{ engagements }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <article style=\"flex:0 0 100%;box-sizing:border-box;padding:40px;border:1px solid var(--line);border-radius:20px;background:var(--surface)\">\n                <img src=\"{{ e.logo }}\" alt=\"{{ e.logoAlt }}\" style=\"display:block;max-width:170px;max-height:54px;width:auto;height:auto;object-fit:contain;margin-bottom:30px\">\n                <div style=\"font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">{{ e.type }}<\u002Fdiv>\n                <h3 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-0.015em;margin:0 0 16px;max-width:640px\">{{ e.headline }}<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;max-width:680px\">{{ e.body }}<\u002Fp>\n                <p style=\"font-size:16px;line-height:1.6;color:var(--ink-2);margin:0;max-width:680px\"><strong style=\"color:var(--ink)\">Impact:<\u002Fstrong> {{ e.impact }}<\u002Fp>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button data-carousel-btn=\"\" aria-label=\"Next engagement\" sc-camel-on-click=\"{{ nextEngagement }}\" style=\"width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-size:18px;cursor:pointer;color:var(--ink-2)\" style-hover=\"background:var(--accent-wash);color:var(--ink)\">→<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;align-items:center;gap:16px;margin-top:20px\">\n        <div style=\"display:flex;gap:8px\">\n          <sc-for list=\"{{ engagementDots }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <button aria-label=\"{{ d.label }}\" sc-camel-on-click=\"{{ d.onClick }}\" style=\"{{ d.dotStyle }}\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono';font-size:12px;color:var(--muted)\">{{ engagementCounterText }}<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- final cta -->\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:40px 40px 72px\">\n      <div data-cta=\"\" style=\"background:var(--ink);border-radius:24px;padding:44px 48px;text-align:center;color:#fff\">\n        <h2 data-cta-title=\"\" style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:32px;line-height:1.25;letter-spacing:-0.02em;margin:0 auto 26px;color:#fff;text-wrap:balance\">Tell me what you're dealing with and I'll tell you if I can help.<\u002Fh2>\n        <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:15px 34px;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--accent-2)\">Get in Touch<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SERVICES ============ -->\n  <sc-if value=\"{{ isServices }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:72px 40px 20px;animation:fadeUp .5s ease both\">\n      <div style=\"font-family:'IBM Plex Mono';font-size:12.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px\">Services offered<\u002Fdiv>\n      <h1 data-h1=\"\" style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-0.025em;margin:0 0 20px;max-width:16ch\">What I do, and the problem each piece solves<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--ink-2);max-width:60ch;margin:0\">I work with technology and healthcare companies, embedded with the finance team part-time or on a specific project. Some engagements are a defined piece of work. More often they continue, because the work does.<\u002Fp>\n    <\u002Fsection>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:36px 40px 84px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px\">\n            <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap\">\n              <div style=\"width:52px;height:52px;border-radius:13px;background:var(--accent-wash);display:flex;align-items:center;justify-content:center;font-size:26px\">{{ s.emoji }}<\u002Fdiv>\n              <div>\n                <h2 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-0.015em;margin:0\">{{ s.title }}<\u002Fh2>\n                <sc-if value=\"{{ s.meta }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--muted);margin-top:3px\">{{ s.meta }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <span style=\"margin-left:auto;font-family:'IBM Plex Mono';font-size:13px;color:var(--accent-2)\">{{ s.n }}<\u002Fspan>\n            <\u002Fdiv>\n            <div data-grid3=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:24px\">\n              <div>\n                <div style=\"font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px\">The problem<\u002Fdiv>\n                <p style=\"font-size:15px;line-height:1.55;color:var(--ink-2);margin:0\">{{ s.problem }}<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ s.solution }}\" hint-placeholder-val=\"{{ true }}\"><div>\n                <div style=\"font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:9px\">My solution<\u002Fdiv>\n                <p style=\"font-size:15px;line-height:1.55;color:var(--ink-2);margin:0\">{{ s.solution }}<\u002Fp>\n              <\u002Fdiv><\u002Fsc-if>\n              <div>\n                <div style=\"font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px\">The impact<\u002Fdiv>\n                <p style=\"font-size:15px;line-height:1.55;color:var(--ink);margin:0;font-weight:500\">{{ s.impact }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 32px\">\n        <p style=\"font-size:16px;line-height:1.6;color:var(--ink-2);margin:0\">Most engagements start as one of these and turn into something else, so if what you're dealing with isn't on this list, it's still worth a conversation.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:36px;display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 30px;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--ink)\">Get in Touch<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ABOUT ============ -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:72px 40px 40px;animation:fadeUp .5s ease both\">\n      <div data-split=\"\" style=\"display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center\">\n        <div>\n          <h1 data-h1=\"\" style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:50px;line-height:1.05;letter-spacing:-0.025em;margin:0 0 22px\">About Mike<\u002Fh1>\n          <p style=\"font-size:17.5px;line-height:1.62;color:var(--ink-2);margin:0 0 16px\">I bring over 20 years in finance, starting in equity research and strategic finance at large public companies, and the last 15 leading FP&amp;A at McKesson, Teladoc, Lyra Health, and Included Health.<\u002Fp>\n          <p style=\"font-size:17.5px;line-height:1.62;color:var(--ink-2);margin:0\">In 2024, I set up Sea Cloud Consulting to give growing companies senior FP&amp;A help without the full-time hire.<\u002Fp>\n        <\u002Fdiv>\n        <div data-headshot=\"\" style=\"position:relative;height:360px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--accent-wash)\">\n          <img src=\"62ceb1b6-719f-4687-aced-224816e06e3b\" alt=\"Mike Duncan, founder of Sea Cloud Consulting\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:24px 40px 40px\">\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px\">\n        <div style=\"font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:24px\">Track record<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ creds }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)\">\n              <span style=\"color:var(--accent);font-size:18px;line-height:1.5\">—<\u002Fspan>\n              <p style=\"margin:0;font-size:16px;line-height:1.55;color:var(--ink-2)\">{{ c.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:16px 40px 84px\">\n      <div data-split=\"\" style=\"display:grid;grid-template-columns:1fr 0.72fr;gap:48px;align-items:center\">\n        <div>\n          <p style=\"font-size:17px;line-height:1.62;color:var(--ink-2);margin:0 0 16px\">Throughout my career I've built investment cases, led acquisitions, advised on corporate strategy, and developed countless financial models. I've also run the planning calendar, built the team, and closed the month.<\u002Fp>\n          <p style=\"font-size:17px;line-height:1.62;color:var(--ink-2);margin:0 0 12px\">Some clients bring me in for a defined project. Most keep me embedded in the team for the long haul, covering gaps through turnover, growth, and the occasional mess.<\u002Fp>\n          <p style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:20px;letter-spacing:-0.01em;margin:20px 0 0\">Get in touch if my experience can support your needs.<\u002Fp>\n          <p style=\"font-size:16px;color:var(--muted);margin:6px 0 0\">— Mike<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--ink);border-radius:20px;padding:36px;color:#fff\">\n          <p style=\"font-size:16px;line-height:1.6;margin:0 0 22px;color:color-mix(in srgb,#fff 82%,transparent)\">Twenty years in finance, embedded with your team part-time.<\u002Fp>\n          <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;width:100%\" style-hover=\"background:var(--accent-2)\">Get in Touch<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ CONTACT ============ -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section data-sec=\"\" style=\"max-width:820px;margin:0 auto;padding:72px 40px 84px;animation:fadeUp .5s ease both\">\n      <div style=\"font-family:'IBM Plex Mono';font-size:12.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px\">Get in touch<\u002Fdiv>\n      <h1 data-h1=\"\" style=\"font-family:'Bricolage Grotesque';font-weight:700;font-size:46px;line-height:1.07;letter-spacing:-0.025em;margin:0 0 18px\">Tell me what you're dealing with<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 40px;max-width:56ch\">I work part-time with technology and healthcare companies, embedded with the finance team. Tell me what you're dealing with and I'll tell you if I can help.<\u002Fp>\n\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:48px;text-align:center\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:var(--accent-wash);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px\">📩<\u002Fdiv>\n          <h2 style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:26px;letter-spacing:-0.015em;margin:0 0 10px\">Thanks.<\u002Fh2>\n          <p style=\"font-size:17px;color:var(--ink-2);margin:0\">I'll get back to you within a day.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ submit }}\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px\">\n        <div data-grid2=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px\">\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Name<\u002Fspan>\n            <input value=\"{{ v.name }}\" sc-camel-on-change=\"{{ f.name }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink)\" style-focus=\"border-color:var(--accent);outline:none\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Email<\u002Fspan>\n            <input type=\"email\" value=\"{{ v.email }}\" sc-camel-on-change=\"{{ f.email }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink)\" style-focus=\"border-color:var(--accent);outline:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <label style=\"display:block;margin-bottom:20px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Company<\u002Fspan>\n          <input value=\"{{ v.company }}\" sc-camel-on-change=\"{{ f.company }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink)\" style-focus=\"border-color:var(--accent);outline:none\">\n        <\u002Flabel>\n        <label style=\"display:block;margin-bottom:20px\">\n          <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">What's going on?<\u002Fspan>\n          <textarea rows=\"4\" value=\"{{ v.message }}\" sc-camel-on-change=\"{{ f.message }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink);resize:vertical;font-family:inherit\" style-focus=\"border-color:var(--accent);outline:none\"><\u002Ftextarea>\n        <\u002Flabel>\n        <div data-grid2=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px\">\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">When do you need someone?<\u002Fspan>\n            <sc-raw-select value=\"{{ v.timeframe }}\" sc-camel-on-change=\"{{ f.timeframe }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink)\" style-focus=\"border-color:var(--accent);outline:none\">\n              <option value=\"\">Select…<\u002Foption>\n              <option>Now<\u002Foption>\n              <option>Next month<\u002Foption>\n              <option>Next quarter<\u002Foption>\n              <option>Still figuring it out<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px\">Roughly how much help do you need?<\u002Fspan>\n            <sc-raw-select value=\"{{ v.hours }}\" sc-camel-on-change=\"{{ f.hours }}\" style=\"width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;background:var(--bg);color:var(--ink)\" style-focus=\"border-color:var(--accent);outline:none\">\n              <option value=\"\">Select…<\u002Foption>\n              <option>A specific project<\u002Foption>\n              <option>A few days a month<\u002Foption>\n              <option>A couple days a week<\u002Foption>\n              <option>Close to full-time<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"background:var(--accent);color:#fff;border:none;border-radius:999px;padding:15px 34px;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--ink)\">Send<\u002Fbutton>\n      <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"border-top:1px solid var(--line);background:var(--surface)\">\n    <div data-sec=\"\" style=\"max-width:1180px;margin:0 auto;padding:44px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:11px\">\n        <img src=\"b69d791a-edf5-46c8-93d2-6c17ad636cc9\" alt=\"\" width=\"32\" height=\"32\" style=\"border-radius:50%\">\n        <div>\n          <div style=\"font-family:'Bricolage Grotesque';font-weight:600;font-size:15px\">Sea Cloud Consulting<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--muted)\">Senior FP&amp;A, embedded part-time<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ go.services }}\" style=\"background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-2)\" style-hover=\"color:var(--ink)\">Services<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.about }}\" style=\"background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-2)\" style-hover=\"color:var(--ink)\">About<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.contact }}\" style=\"background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-2)\" style-hover=\"color:var(--ink)\">Contact<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--muted)\">© {{ year }} Sea Cloud Consulting<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { page:'home', hero:'a', name:'', email:'', company:'', message:'', timeframe:'', hours:'', submitted:false, engagementIndex:0 };\n\n  palettes = {\n    sea:  {'--ink':'#16232D','--ink-2':'#40525E','--muted':'#6B7A83','--bg':'#F6F7F4','--surface':'#FFFFFF','--line':'#E4E7E2','--accent':'#2E7D8A','--accent-2':'#8FB9BF','--accent-wash':'#E7F0F1'}\n  };\n\n  engagements = [\n    { logo:'775eebc1-4124-40d2-bcb1-818d57897034', logoAlt:'Barracuda', type:'FP&A Leadership', headline:'Stepping in during a critical transition',\n      body:'Stepped in during a critical budget cycle after a senior FP&A leader departed, then expanded into ongoing operational finance support during a period of team transition and cost reduction.',\n      impact:'Maintained continuity for leadership while simplifying processes and efficiently absorbing responsibilities previously spread across multiple roles.' },\n    { logo:'775eebc1-4124-40d2-bcb1-818d57897034', logoAlt:'Barracuda', type:'Sales Ops', headline:'Covering Sales Ops through transitions',\n      body:'Stepped into Sales Operations during a period of significant team turnover, taking over channel partner programs, rebate operations, and marketplace reporting, then later supporting the commissions team during another transition.',\n      impact:'Kept the work moving without disruption, while improving reporting, cutting a full-day rebate process to under an hour, and helping validate and stabilize commissions during a major Xactly rebuild.' },\n    { logo:'4b863154-dac3-4081-9883-9dad3322aa28', logoAlt:'BluWave', type:'Strategic Finance', headline:'Supporting the CFO across strategic decisions',\n      body:'Supported the CFO across financial modeling, LTV/CAC analysis, acquisition strategy, and annual planning.',\n      impact:'Identified forecast issues, informed the decision not to pursue a tuck-in acquisition strategy, and created a more streamlined budgeting and variance-analysis process.' },\n    { logo:'77b5fa06-bd62-4e42-8bf3-96553165ecfc', logoAlt:'Beyond Type 1', type:'Financial Model Rebuild', headline:'Turning a difficult model into a useful operating tool',\n      body:'Rebuilt a difficult-to-maintain model into a customer-driven revenue forecast and consistent departmental expense model.',\n      impact:'Improved visibility into revenue and spending while reducing routine model updates from hours to minutes.' }\n  ];\n\n  nextEngagement = () => { const n = this.engagements.length; this.setState({ engagementIndex: ((this.state.engagementIndex||0) + 1) % n }); };\n  prevEngagement = () => { const n = this.engagements.length; this.setState({ engagementIndex: ((this.state.engagementIndex||0) - 1 + n) % n }); };\n  goToEngagement = (i) => () => this.setState({ engagementIndex: i });\n  onEngagementTouchStart = (e) => { this._touchStartX = e.changedTouches[0].screenX; };\n  onEngagementTouchEnd = (e) => {\n    const dx = (this._touchStartX||0) - e.changedTouches[0].screenX;\n    if (dx > 50) this.nextEngagement();\n    else if (dx < -50) this.prevEngagement();\n  };\n\n  componentDidMount(){ this.apply(); }\n  componentDidUpdate(){ this.apply(); }\n\n  apply(){\n    const p = this.palettes.sea;\n    if(this.rootEl){ Object.entries(p).forEach(([k,v]) => this.rootEl.style.setProperty(k,v)); }\n  }\n\n  setRoot = (el) => { this.rootEl = el; if(el) this.apply(); };\n  setPage = (p) => () => { this.setState({ page:p }); if(typeof window!=='undefined') window.scrollTo({top:0}); };\n  field = (k) => (e) => this.setState({ [k]: e.target.value });\n  submit = (e) => { e.preventDefault(); this.setState({ submitted:true }); };\n  hoverOn = () => this.setState({ heroHover:true });\n  hoverOff = () => this.setState({ heroHover:false });\n\n  renderVals(){\n    const s = this.state;\n    const page = s.page;\n    return {\n      setRoot: this.setRoot,\n      hoverOn: this.hoverOn, hoverOff: this.hoverOff,\n      tintOpacity: s.heroHover ? 0 : 0.62,\n      isHome: page==='home', isServices: page==='services', isAbout: page==='about', isContact: page==='contact',\n      go: {\n        home: this.setPage('home'), services: this.setPage('services'), about: this.setPage('about'),\n        contact: this.setPage('contact')\n      },\n      year: 2026,\n      engagements: this.engagements,\n      engagementOffset: -(s.engagementIndex||0) * 100,\n      engagementCounterText: ((s.engagementIndex||0)+1) + ' / ' + this.engagements.length,\n      engagementDots: this.engagements.map((_,i) => ({\n        label: 'Go to engagement ' + (i+1),\n        onClick: this.goToEngagement(i),\n        dotStyle: 'width:8px;height:8px;padding:0;border:0;border-radius:50%;cursor:pointer;background:' + (i===(s.engagementIndex||0) ? 'var(--ink)' : 'var(--line)')\n      })),\n      nextEngagement: this.nextEngagement,\n      prevEngagement: this.prevEngagement,\n      onEngagementTouchStart: this.onEngagementTouchStart,\n      onEngagementTouchEnd: this.onEngagementTouchEnd,\n      stats: [\n        { k:'20+ years\\nin finance', v:'' },\n        { k:'FP&A\\nleadership', v:'' },\n        { k:'Tech &\\nhealthcare', v:'' }\n      ],\n      pains: [\n        { e:'🚶', t:'A senior member of your FP&A team left at a critical time, and the search for a replacement will take months.' },\n        { e:'🔧', t:'Your financial model is broken, and nobody trusts the numbers coming out of it anymore.' },\n        { e:'📅', t:'Budget season is coming, your team is already stretched thin, and something will get dropped.' }\n      ],\n      services: [\n        { n:'01', emoji:'🧭', title:'Part-Time Embedded FP&A Support', meta:'10–30 hrs / week',\n          problem:'The FP&A team is stretched too thin, juggling competing priorities and risking missed deadlines, errors, and burnout.',\n          solution:'I embed with your team for 10 to 30 hours a week, working inside your systems and your calendar rather than from the outside.',\n          impact:'Priorities move forward, your team stops running at redline, and you get continuity from someone who already knows how the business works.' },\n        { n:'02', emoji:'🚪', title:'Interim FP&A Leadership During a Search', meta:'',\n          problem:'Your FP&A leader left and the search will take months. Meanwhile the forecast still has to close, the board still meets, and the team still needs someone to answer to.',\n          solution:'I step in as interim FP&A leadership while the search runs, keeping the forecast, board reporting, and team moving without a gap in coverage.',\n          impact:'You hire on your timeline instead of settling for whoever is available, and the team keeps its footing through the transition.' },\n        { n:'03', emoji:'🔧', title:'Annual Forecasts & Model Builds / Rebuilds', meta:'',\n          problem:'Nobody trusts the models or understands the assumptions. Board prep requires a lot of manual work.',\n          solution:'I rebuild the model from the ground up so it is accurate, logical, and easy for your team to maintain going forward.',\n          impact:'You trust the forecast, and your team can update and maintain the model without calling me.' },\n        { n:'04', emoji:'📈', title:'Long Range Financial Models & Strategic Planning', meta:'',\n          problem:'Without a working long-range model, questions from the CEO, board, and investors turn into a fire drill every time.',\n          solution:'I build and refine the long-range model so it is accurate and actionable, and advise on the planning process behind it.',\n          impact:'You answer hard questions with numbers you can defend, and the plan holds up under scrutiny.' }\n      ],\n      engs: [\n        { tag:'Mid-Sized Software Company', meta:'Ongoing · 18+ months',\n          body:'I joined to cover the head of FP&A role while the company searched for a permanent leader. Over the next year and a half the team turned over several times, and I covered each gap as it opened, including a stretch running the team and, more recently, planning and forecasting for sales operations. The engagement has run at roughly 30 hours a week throughout. What started as coverage for one role became continuity through a period when the company would otherwise have lost most of its institutional knowledge.',\n          cap:'Embedded FP&A support, 18+ months and ongoing' },\n        { tag:'Growth-Stage Company', meta:'Reporting to the CFO',\n          body:'I worked directly with the CFO on planning and analysis, starting with strategic work and moving into building the infrastructure behind the annual budget. The goal was to leave the company with a planning process it could run without me. That is what happened.',\n          cap:'Budget infrastructure and planning process' },\n        { tag:'Third Engagement', meta:'Placeholder',\n          body:'A third engagement write-up goes here, same shape as the others: the situation you stepped into, what you did, and how long it lasted. Keep duration front and center, since it is the fact that proves the arrangement works.',\n          cap:'To be written' }\n      ],\n      creds: [\n        { text:'Built 3-statement models, complex revenue builds, M&A analysis, and competitive analysis to help companies make better decisions.' },\n        { text:'Led FP&A teams, including interim leadership during executive searches.' },\n        { text:'Ran the monthly forecast, budget cycle, and board reporting calendar, including the unglamorous work that keeps a finance team credible.' },\n        { text:'Delivered $10M+ in run-rate cost reduction and $50M in acquisition synergies.' }\n      ],\n      v: { name:s.name, email:s.email, company:s.company, message:s.message, timeframe:s.timeframe, hours:s.hours },\n      f: { name:this.field('name'), email:this.field('email'), company:this.field('company'), message:this.field('message'), timeframe:this.field('timeframe'), hours:this.field('hours') },\n      submit: this.submit,\n      submitted: s.submitted,\n      notSubmitted: !s.submitted\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
